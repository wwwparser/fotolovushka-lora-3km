<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">Заводская камера и внешняя USB–LoRa приставка</title><desc id="desc">Камера сохраняет оригинал на свою карту. ESP32-S3 через защищённый коммутируемый USB копирует фото на отдельную карту. После отключения USB передаётся превью через LoRa.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254e3a"/></marker></defs>
<rect width="1100" height="600" rx="20" fill="#efeee6"/><g font-family="Arial,sans-serif" fill="#20352a"><text x="45" y="48" font-size="24" font-weight="bold">Штатная камера сохраняется целиком</text><text x="45" y="78" font-size="15">USB подключён только на время скачивания • возврат к PIR проверяется на стенде</text>
<g stroke="#254e3a" stroke-width="2" fill="#fffdf6"><rect x="45" y="130" width="215" height="290" rx="18"/><rect x="365" y="130" width="255" height="290" rx="18"/><rect x="730" y="130" width="320" height="290" rx="18"/></g>
<text x="67" y="162" font-size="19" font-weight="bold">Фотоловушка</text><circle cx="150" cy="215" r="32" fill="#254e3a"/><circle cx="150" cy="215" r="16" fill="#72977c"/><text x="70" y="280" font-size="16">Объектив + PIR + ИК</text><text x="70" y="312" font-size="16">Свои батареи</text><text x="70" y="344" font-size="16">Своя SD: оригиналы</text><text x="70" y="385" font-size="15">Рабочий ON → USB → ON?</text>
<text x="390" y="162" font-size="19" font-weight="bold">USB-коммутатор</text><text x="390" y="215" font-size="17">TPS2553: VBUS 5 В</text><text x="390" y="245" font-size="15">Ограничение тока / FAULT</text><text x="390" y="292" font-size="17">TS3USB221: D+ / D−</text><text x="390" y="322" font-size="15">Размыкание пары данных</text><text x="390" y="385" font-size="15">При сбросе всё отключено</text>
<text x="755" y="162" font-size="19" font-weight="bold">Внешняя приставка</text><text x="755" y="215" font-size="17">ESP32-S3 / USB Host MSC</text><text x="755" y="250" font-size="16">Отдельная SD: очередь</text><text x="755" y="285" font-size="16">Превью ≤ 5 КиБ / 160×120</text><text x="755" y="320" font-size="16">RFM95W 868 + антенна</text><text x="755" y="385" font-size="15">Свой источник питания</text>
<g stroke="#254e3a" stroke-width="3" marker-end="url(#a)" fill="none"><path d="M265 235H353"/><path d="M625 235H718"/><path d="M900 426V480H635"/></g><text x="283" y="222" font-size="15">USB</text><text x="645" y="222" font-size="15">USB</text>
<rect x="45" y="470" width="580" height="88" rx="12" fill="#254e3a"/><text x="66" y="504" font-size="18" fill="#fffdf6">LoRa-база → ПК → письмо с превью</text><text x="66" y="535" font-size="15" fill="#fffdf6">Передача начинается после отсоединения USB от камеры</text><text x="720" y="540" font-size="15">Схема прототипа, не разводка PCB</text></g></svg>
